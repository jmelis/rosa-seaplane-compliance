# complyctl runtime config. Both OCI references below must be published
# first (make publish-policy / make publish-opa-bundle) and must match what
# you pushed.
#
# Points at a local-only registry by default (matching Makefile's REGISTRY
# default) so nothing here touches a public registry or real AWS out of the
# box — see docs/credentials.md for how to run that local registry and S3
# locker, and for pointing this at a real registry once the project has one.

policies:
  - url: http://localhost:5050/rosa-seaplane-compliance/policies/change-management:v0.1.0
    id: change-management

# Global (not per-target) variable: tells ampel-provider's Generate step
# where to find our own granular AMPEL policy JSON files (ampel/policies/),
# instead of requiring them to be shipped inside the OCI policy bundle.
# Relative to the workspace (complyctl's CWD, always this repo root): unlike
# targets[].variables, complyctl's top-level `variables:` are NOT expanded
# for ${ENV_VAR} references (internal/complytime/config.go's resolveEnvVars
# only walks config.Targets), so a ${RSC_REPO_ROOT}-style absolute path here
# would be passed through literally, unexpanded.
variables:
  ampel_policy_dir: ampel/policies

# Two targets, not one: complyctl's TargetConfig.Variables is a single flat
# map per target, shared by every provider evaluating that target. ampel
# hard-requires a variable literally named "url"
# (ampel-provider's RequiredTargetVariables); opa-provider separately
# rejects a target whose variables carry both "url" and "input_path"
# (its own generic "one evidence source per target" validation,
# cmd/opa-provider/server/server.go validateTargetVariables). A single
# target carrying both AR01's "url" and AR02's "input_path" always fails
# opa-provider's check — this is not a quirk of a local/test registry, it
# fails identically against the real published bundles. Split per evaluator.
targets:
  - id: rosa-seaplane-ampel
    policies:
      - change-management
    variables:
      # ampel (evaluator id: ampel) -> RSC.CMT.CTRL01.AR01
      # branch-protection configuration check ("is the gate set up?")
      url: https://github.com/openshift-online/rosa-seaplane
      # Custom spec, not snappy's builtin:github/branch-rules.yaml — that
      # builtin calls GitHub's newer Rulesets API, not classic branch
      # protection (see ampel/specs/github-branch-protection.yaml's header
      # comment). Must be an absolute path (ResolveSpecPath only resolves
      # bare/relative refs against its own internal spec dir, not this repo).
      specs: ${RSC_REPO_ROOT}/ampel/specs/github-branch-protection.yaml
      branches: main
      access_token: ${GITHUB_TOKEN}

  - id: rosa-seaplane-opa
    policies:
      - change-management
    variables:
      # opa (evaluator id: opa) -> RSC.CMT.CTRL01.AR02
      # merge-practice check ("did the gate actually hold?")
      opa_bundle_ref: http://localhost:5050/rosa-seaplane-compliance/opa-bundles/rosa-seaplane:v0.1.0
      # Must be an absolute path; AR02's own evidence subdir so conftest reads
      # only merge evidence (RSC_EVIDENCE_DIR set via entrypoint.py).
      input_path: ${RSC_EVIDENCE_DIR}/RSC.CMT.CTRL01.AR02
