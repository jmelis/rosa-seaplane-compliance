  - id: "KSI-CMT-RMV"
    title: "Redeploying vs Modifying"
    objective: >
      Changes to machine-based information resources are executed through the redeployment of version
      controlled resources rather than direct modification wherever reasonable.
    group: change-management
    guidelines:
      - reference-id: fedramp-sp800-53-guidance
        entries:
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-02 — Baseline Configuration"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-03 — Configuration Change Control"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-05 — Access Restrictions for Change"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-06 — Configuration Settings"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-07 — Least Functionality"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-08 (01) — Updates During Installation and Removal"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "SI-03 — Malicious Code Protection"
    assessment-requirements:
      - id: "KSI-CMT-RMV-AR1"
        text: >
          Demonstrate Redeploying vs Modifying by implementing CM-02 (Baseline Configuration) per NIST SP
          800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CMT-RMV-AR2"
        text: >
          Demonstrate Redeploying vs Modifying by implementing CM-03 (Configuration Change Control) per NIST
          SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CMT-RMV-AR3"
        text: >
          Demonstrate Redeploying vs Modifying by implementing CM-05 (Access Restrictions for Change) per NIST
          SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CMT-RMV-AR4"
        text: >
          Demonstrate Redeploying vs Modifying by implementing CM-06 (Configuration Settings) per NIST SP
          800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CMT-RMV-AR5"
        text: >
          Demonstrate Redeploying vs Modifying by implementing CM-07 (Least Functionality) per NIST SP 800-53
          Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CMT-RMV-AR6"
        text: >
          Demonstrate Redeploying vs Modifying by implementing CM-08 (01) (Updates During Installation and
          Removal) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CMT-RMV-AR7"
        text: >
          Demonstrate Redeploying vs Modifying by implementing SI-03 (Malicious Code Protection) per NIST SP
          800-53 Rev 5.
        applicability:
          - class-b
          - class-c
  - id: "KSI-CMT-RVP"
    title: "Reviewing Change Procedures"
    objective: >
      The effectiveness of documented change management procedures is persistently reviewed.
    group: change-management
    guidelines:
      - reference-id: fedramp-sp800-53-guidance
