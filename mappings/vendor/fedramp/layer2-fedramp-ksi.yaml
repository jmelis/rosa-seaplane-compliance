          Demonstrate Logging Changes by implementing AU-02 (Event Logging) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CMT-LMC-AR2"
        text: >
          Demonstrate Logging Changes by implementing CA-07 (04) (Risk Monitoring) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CMT-LMC-AR3"
        text: >
          Demonstrate Logging Changes by implementing CM-03 (Configuration Change Control) per NIST SP 800-53
          Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CMT-LMC-AR4"
        text: >
