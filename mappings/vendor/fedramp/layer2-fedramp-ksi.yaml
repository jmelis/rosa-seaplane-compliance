title: "FedRAMP 2026 Key Security Indicators — Class C Controls"
metadata:
  id: fedramp-ksi-controls
  type: ControlCatalog
  gemara-version: "1.0.0"
  version: "2026.1.0"
  date: "2026-06-24T00:00:00Z"
  description: >
    FedRAMP 20x Key Security Indicators as assessable controls for
    Class C certification. 46 controls across 10 security themes,
    with 559 assessment requirements mapping to NIST SP 800-53
    Rev 5 controls. Five KSIs are Class C-only (optional at Class B).
  author:
    id: fedramp-pmo
    name: "FedRAMP PMO"
    type: Human
    description: "Federal Risk and Authorization Management Program"
  draft: false
  mapping-references:
    - id: fedramp-sp800-53-guidance
      title: "NIST SP 800-53 Rev 5 — FedRAMP KSI-Referenced Controls"
      version: "5.2.0"
      description: "SP 800-53 controls serving as guidance foundation for KSIs"
    - id: nist-sp-800-53
      title: "NIST SP 800-53 Rev. 5"
      version: "5.2.0"
      description: "Security and Privacy Controls for Information Systems and Organizations"
      url: "https://csrc.nist.gov/projects/risk-management/sp800-53-controls"
  applicability-groups:
    - id: class-b
      title: "FedRAMP Class B"
      description: "41 KSIs required, 5 optional"
    - id: class-c
      title: "FedRAMP Class C"
      description: "All 46 KSIs required"
    - id: class-d
      title: "FedRAMP Class D"
      description: "FedRAMP Rev5 legacy certification path"

groups:
  - id: cybersecurity-education
    title: "Cybersecurity Education"
    description: "Controls ensuring cybersecurity awareness, role-specific training, and continuous education for all personnel"
  - id: change-management
    title: "Change Management"
    description: "Controls for logging, validating, and reviewing changes to cloud service offerings through version-controlled processes"
  - id: cloud-native-architecture
    title: "Cloud Native Architecture"
    description: "Controls for secure cloud-native design including least-privilege functions, ephemeral infrastructure, and automated security enforcement"
  - id: identity-access-management
    title: "Identity and Access Management"
    description: "Controls for authentication, authorization, privilege management, and identity lifecycle across cloud service offerings"
  - id: incident-response
    title: "Incident Response"
    description: "Controls for incident detection, response planning, reporting, and post-incident review"
  - id: monitoring-logging-auditing
    title: "Monitoring, Logging, and Auditing"
    description: "Controls for persistent event collection, log management, security monitoring, and audit trail integrity"
  - id: policy-inventory
    title: "Policy and Inventory"
    description: "Controls for maintaining security policies, asset inventories, risk assessments, and documentation review processes"
  - id: recovery-planning
    title: "Recovery Planning"
    description: "Controls for backup, disaster recovery, continuity testing, and operational resilience"
  - id: supply-chain-risk
    title: "Supply Chain Risk"
    description: "Controls for identifying, monitoring, and mitigating risks from third-party components and services"
  - id: service-configuration
    title: "Service Configuration"
    description: "Controls for automated configuration management, secret rotation, integrity validation, and security hardening of information resources"

controls:
  - id: "KSI-CED-RAT"
    title: "Reviewing All Training"
    objective: >
      The effectiveness of relevant cybersecurity education and training is persistently reviewed,
      including at least general training for all employees, role-specific training for employees in high
      risk roles, training for development and engineering staff on secure software delivery, and training
      for staff involved with incident response or disaster recovery.
    group: cybersecurity-education
    guidelines:
      - reference-id: fedramp-sp800-53-guidance
        entries:
          - reference-id: fedramp-sp800-53-guidance
            remarks: "AT-02 — Literacy Training and Awareness"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "AT-02 (02) — Insider Threat"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "AT-02 (03) — Social Engineering and Mining"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "AT-03 — Role-based Training"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "AT-03 (05) — Processing Personally Identifiable Information"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "AT-04 — Training Records"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-11 — User-installed Software"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CP-03 — Contingency Training"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CP-03 (01) — Simulated Events"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "IR-02 — Incident Response Training"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "IR-02 (01) — Simulated Events"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "IR-02 (02) — Automated Training Environments"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "IR-02 (03) — Breach"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "IR-09 (02) — Training"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "IR-09 (04) — Exposure to Unauthorized Personnel"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "PL-04 — Rules of Behavior"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "PL-04 (01) — Social Media and External Site/Application Usage Restrictions"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "PS-06 — Access Agreements"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "SR-11 (01) — Anti-counterfeit Training"
    assessment-requirements:
      - id: "KSI-CED-RAT-AR1"
        text: >
          Demonstrate Reviewing All Training by implementing AT-02 (Literacy Training and Awareness) per NIST
          SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR2"
        text: >
          Demonstrate Reviewing All Training by implementing AT-02 (02) (Insider Threat) per NIST SP 800-53
          Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR3"
        text: >
          Demonstrate Reviewing All Training by implementing AT-02 (03) (Social Engineering and Mining) per
          NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR4"
        text: >
          Demonstrate Reviewing All Training by implementing AT-03 (Role-based Training) per NIST SP 800-53
          Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR5"
        text: >
          Demonstrate Reviewing All Training by implementing AT-03 (05) (Processing Personally Identifiable
          Information) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR6"
        text: >
          Demonstrate Reviewing All Training by implementing AT-04 (Training Records) per NIST SP 800-53 Rev
          5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR7"
        text: >
          Demonstrate Reviewing All Training by implementing CM-11 (User-installed Software) per NIST SP
          800-53 Rev 5.
        applicability:
          - class-b
          - class-c
        recommendation: >
          FedRAMP parameter values — cm-11_odp.03: Continuously (via CM-7 (5))
      - id: "KSI-CED-RAT-AR8"
        text: >
          Demonstrate Reviewing All Training by implementing CP-03 (Contingency Training) per NIST SP 800-53
          Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR9"
        text: >
          Demonstrate Reviewing All Training by implementing CP-03 (01) (Simulated Events) per NIST SP 800-53
          Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR10"
        text: >
          Demonstrate Reviewing All Training by implementing IR-02 (Incident Response Training) per NIST SP
          800-53 Rev 5.
        applicability:
          - class-b
          - class-c
        recommendation: >
          FedRAMP guidance — Follow the FedRAMP Incident Evaluation and Communication rules.
      - id: "KSI-CED-RAT-AR11"
        text: >
          Demonstrate Reviewing All Training by implementing IR-02 (01) (Simulated Events) per NIST SP 800-53
          Rev 5.
        applicability:
          - class-b
          - class-c
        recommendation: >
          FedRAMP guidance — Follow the FedRAMP Incident Evaluation and Communication rules.
      - id: "KSI-CED-RAT-AR12"
        text: >
          Demonstrate Reviewing All Training by implementing IR-02 (02) (Automated Training Environments) per
          NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
        recommendation: >
          FedRAMP guidance — Follow the FedRAMP Incident Evaluation and Communication rules.
      - id: "KSI-CED-RAT-AR13"
        text: >
          Demonstrate Reviewing All Training by implementing IR-02 (03) (Breach) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR14"
        text: >
          Demonstrate Reviewing All Training by implementing IR-09 (02) (Training) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
        recommendation: >
          FedRAMP guidance — Follow the FedRAMP Incident Evaluation and Communication rules.
      - id: "KSI-CED-RAT-AR15"
        text: >
          Demonstrate Reviewing All Training by implementing IR-09 (04) (Exposure to Unauthorized Personnel)
          per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
        recommendation: >
          FedRAMP guidance — Follow the FedRAMP Incident Evaluation and Communication rules.
      - id: "KSI-CED-RAT-AR16"
        text: >
          Demonstrate Reviewing All Training by implementing PL-04 (Rules of Behavior) per NIST SP 800-53 Rev
          5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR17"
        text: >
          Demonstrate Reviewing All Training by implementing PL-04 (01) (Social Media and External
          Site/Application Usage Restrictions) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR18"
        text: >
          Demonstrate Reviewing All Training by implementing PS-06 (Access Agreements) per NIST SP 800-53 Rev
          5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CED-RAT-AR19"
        text: >
          Demonstrate Reviewing All Training by implementing SR-11 (01) (Anti-counterfeit Training) per NIST
          SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
  - id: "KSI-CMT-LMC"
    title: "Logging Changes"
    objective: >
      Modifications to the cloud service offering are logged and monitored.
    group: change-management
    guidelines:
      - reference-id: fedramp-sp800-53-guidance
        entries:
          - reference-id: fedramp-sp800-53-guidance
            remarks: "AU-02 — Event Logging"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CA-07 (04) — Risk Monitoring"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-03 — Configuration Change Control"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-03 (01) — Automated Documentation, Notification, and Prohibition of Changes"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-03 (02) — Testing, Validation, and Documentation of Changes"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-03 (06) — Cryptography Management"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-04 (02) — Verification of Controls"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-06 — Configuration Settings"
