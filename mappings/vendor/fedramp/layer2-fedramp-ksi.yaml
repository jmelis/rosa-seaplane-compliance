  - id: "KSI-CNA-DFP"
    title: "Defining Functionality and Privileges"
    objective: >
      The functionality and privileges for infrastructure and services are strictly defined.
    group: cloud-native-architecture
    guidelines:
      - reference-id: fedramp-sp800-53-guidance
        entries:
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-02 — Baseline Configuration"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CM-08 (04) — Accountability Information"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "CP-10 (04) — Restore Within Time Period"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "IR-09 (04) — Exposure to Unauthorized Personnel"
          - reference-id: fedramp-sp800-53-guidance
            remarks: "SI-03 — Malicious Code Protection"
    assessment-requirements:
      - id: "KSI-CNA-DFP-AR1"
        text: >
          Demonstrate Defining Functionality and Privileges by implementing CM-02 (Baseline Configuration) per
          NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CNA-DFP-AR2"
        text: >
          Demonstrate Defining Functionality and Privileges by implementing CM-08 (04) (Accountability
          Information) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
      - id: "KSI-CNA-DFP-AR3"
        text: >
          Demonstrate Defining Functionality and Privileges by implementing CP-10 (04) (Restore Within Time
          Period) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
        recommendation: >
          FedRAMP parameter values — cp-10.04_odp: time period consistent with the restoration time-periods
          defined in the service provider and organization Service Level Agreements
      - id: "KSI-CNA-DFP-AR4"
        text: >
          Demonstrate Defining Functionality and Privileges by implementing IR-09 (04) (Exposure to
          Unauthorized Personnel) per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
        recommendation: >
          FedRAMP guidance — Follow the FedRAMP Incident Evaluation and Communication rules.
      - id: "KSI-CNA-DFP-AR5"
        text: >
          Demonstrate Defining Functionality and Privileges by implementing SI-03 (Malicious Code Protection)
          per NIST SP 800-53 Rev 5.
        applicability:
          - class-b
          - class-c
  - id: "KSI-CNA-EIS"
    title: "Enforcing Intended State"
    objective: >
      Automated services are used to persistently assess the security of all machine-based information
