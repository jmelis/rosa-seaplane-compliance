  - id: "KSI-IAM-JIT"
    title: "Authorizing Just-in-Time"
    objective: >
      A least-privileged, role and attribute-based, and just-in-time security authorization model is used
      and persistently reviewed for all user and non-user accounts and services.
    group: identity-access-management
