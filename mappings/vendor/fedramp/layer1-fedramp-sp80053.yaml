title: "NIST SP 800-53 Rev 5 — FedRAMP KSI-Referenced Controls"
metadata:
  id: fedramp-sp800-53-guidance
  type: GuidanceCatalog
  gemara-version: "1.0.0"
  version: "5.2.0"
  date: "2026-06-24T00:00:00Z"
  description: >
    NIST SP 800-53 Rev 5 security controls referenced by FedRAMP 2026
    Key Security Indicators. Contains 302 guidelines across 16 control
    families, serving as the generic security guidance foundation for
    FedRAMP Class C certification.
  author:
    id: nist
    name: "NIST"
    type: Human
    description: "National Institute of Standards and Technology"
  draft: false
  mapping-references:
    - id: nist-sp-800-53
      title: "NIST SP 800-53 Rev. 5"
      version: "5.2.0"
      description: "Security and Privacy Controls for Information Systems and Organizations"
      url: "https://csrc.nist.gov/projects/risk-management/sp800-53-controls"
  applicability-groups:
    - id: class-b
      title: "FedRAMP Class B"
      description: "FedRAMP 20x Class B baseline"
    - id: class-c
      title: "FedRAMP Class C"
      description: "FedRAMP 20x Class C baseline"
    - id: class-d
      title: "FedRAMP Class D"
      description: "FedRAMP Rev5 legacy certification path"

type: Standard

front-matter: >
  NIST SP 800-53 Rev 5 provides security and privacy controls for federal
  information systems. This guidance catalog contains the 302 controls
  referenced by FedRAMP 2026 Key Security Indicators (KSIs) for Class C
  certification. Control objectives are derived from the NIST OSCAL catalog
  with parameter placeholders normalized to [organization-defined].

groups:
  - id: access-control
    title: "Access Control"
    description: "Controls for managing access to information systems, enforcing least privilege, and controlling remote and wireless access"
  - id: awareness-training
    title: "Awareness and Training"
    description: "Controls for security awareness programs, role-based training, and training records"
  - id: audit-accountability
    title: "Audit and Accountability"
    description: "Controls for audit logging, monitoring, analysis, and protection of audit information"
  - id: assessment-authorization-monitoring
    title: "Assessment, Authorization, and Monitoring"
    description: "Controls for security assessments, system connections, continuous monitoring, and penetration testing"
  - id: configuration-management
    title: "Configuration Management"
    description: "Controls for baseline configurations, change control, least functionality, and software restrictions"
  - id: contingency-planning
    title: "Contingency Planning"
    description: "Controls for contingency plans, backups, alternate processing and storage sites, and system recovery"
  - id: identification-authentication
    title: "Identification and Authentication"
    description: "Controls for user and device identification, authenticator management, and identity proofing"
  - id: incident-response
    title: "Incident Response"
    description: "Controls for incident handling, reporting, response planning, and information spillage"
  - id: planning
    title: "Planning"
    description: "Controls for security planning, rules of behavior, and security architecture"
  - id: program-management
    title: "Program Management"
    description: "Controls for information security program management and oversight"
  - id: personnel-security
    title: "Personnel Security"
    description: "Controls for personnel screening, termination, transfer, and access agreements"
  - id: risk-assessment
    title: "Risk Assessment"
    description: "Controls for risk assessment, vulnerability scanning, and risk monitoring"
  - id: system-services-acquisition
    title: "System and Services Acquisition"
    description: "Controls for system development lifecycle, acquisition processes, and supply chain protections"
  - id: system-communications-protection
    title: "System and Communications Protection"
    description: "Controls for boundary protection, cryptography, network security, and communications confidentiality"
  - id: system-information-integrity
    title: "System and Information Integrity"
    description: "Controls for flaw remediation, malicious code protection, information integrity, and monitoring"
  - id: supply-chain-risk-management
    title: "Supply Chain Risk Management"
    description: "Controls for supply chain risk assessment, component authenticity, and provenance"

