title: "FedRAMP 2026 — Class C Certification Policy"
metadata:
  id: fedramp-class-c-policy
  type: Policy
  gemara-version: "1.0.0"
  version: "2026.1.0"
  date: "2026-06-24T00:00:00Z"
  description: >
    FedRAMP Consolidated Rules for 2026 — Class C certification policy.
    Defines scope, imported controls, risk posture, and adherence requirements
    for cloud service providers seeking FedRAMP 20x Class C certification.
  author:
    id: fedramp-pmo
    name: "FedRAMP PMO"
    type: Human
    description: "Federal Risk and Authorization Management Program"
  draft: false
  mapping-references:
    - id: fedramp-ksi-controls
      title: "FedRAMP 2026 Key Security Indicators — Class C Controls"
      version: "2026.1.0"
      description: "46 KSI controls with SP 800-53 assessment requirements"
    - id: fedramp-sp800-53-guidance
      title: "NIST SP 800-53 Rev 5 — FedRAMP KSI-Referenced Controls"
      version: "5.2.0"
      description: "302 SP 800-53 guidelines serving as guidance foundation for KSIs"

contacts:
  responsible:
    - name: "Cloud Service Provider Security Team"
      affiliation: "Provider Organization"
  accountable:
    - name: "Cloud Service Provider Authorizing Official"
      affiliation: "Provider Organization"
  consulted:
    - name: "FedRAMP PMO"
      affiliation: "General Services Administration"
    - name: "Independent Assessor"
      affiliation: "3PAO"
  informed:
    - name: "Federal Agency Customers"
      affiliation: "Subscribing Agencies"

scope:
  in:
    technologies:
      - "Cloud Service Offerings (IaaS, PaaS, SaaS)"
      - "Cloud-hosted applications processing federal information"
    sensitivity:
      - "Federal Information — Moderate Impact (FIPS 199)"
      - "Controlled Unclassified Information (CUI)"
    users:
      - "Cloud Service Providers"
      - "Federal Agency Customers"
      - "Provider Operations and Engineering Staff"
  out:
    technologies:
      - "Single-agency systems hosted on cloud infrastructure"
      - "Social media and communications platforms"
      - "Search engines"
      - "Ancillary services posing negligible risk to federal information"
    users:
      - "Anonymous public users accessing non-federal content"

imports:
  catalogs:
    - reference-id: fedramp-ksi-controls
      constraints:
        - id: CON-CLASS-C-ALL-KSI
          target-id: "*"
          text: >
            Class C certification requires persistent demonstration of all 46 Key Security
            Indicators. Five KSIs (CNA-EIS, MLA-ALA, SVC-PRR, SVC-RUD, SVC-VCM) that are
            optional at Class B are mandatory at Class C.
        - id: CON-CLASS-C-PERSIST
          target-id: "*"
          text: >
            All controls MUST be persistently demonstrated through automation and continuous
            monitoring. Persistent means the security outcome is actively maintained and
            regularly verified, not just implemented once.
        - id: CON-CLASS-C-SDR
          target-id: "*"
          text: >
            Providers MUST maintain a Security Decision Record (SDR) documenting how each
            KSI is addressed, including 30-day summaries, up to one year of historical
            summaries, and daily data up to one year where available.
  guidance:
    - reference-id: fedramp-sp800-53-guidance

risks:
  mitigated:
    - id: MIT-DATA-BREACH
      risk:
        reference-id: fedramp-ksi-controls
        entry-id: "KSI-IAM-MFA"
    - id: MIT-UNAUTHORIZED-ACCESS
      risk:
        reference-id: fedramp-ksi-controls
        entry-id: "KSI-IAM-PRA"
    - id: MIT-CONFIG-DRIFT
      risk:
        reference-id: fedramp-ksi-controls
        entry-id: "KSI-SVC-VCM"
    - id: MIT-INCIDENT-UNDETECTED
      risk:
        reference-id: fedramp-ksi-controls
        entry-id: "KSI-INR-IRP"
    - id: MIT-SUPPLY-CHAIN
      risk:
        reference-id: fedramp-ksi-controls
        entry-id: "KSI-SCR-TPM"

adherence:
  evaluation-methods:
    - id: EVAL-PERSISTENT-AUTOMATED
      type: Behavioral
      mode: Automated
      required: true
      description: >
        Persistent automated monitoring and validation of KSI outcomes
        through continuous security assessment tooling.
    - id: EVAL-SDR-REVIEW
      type: Intent
      mode: Manual
      required: true
      description: >
        Manual review of Security Decision Records documenting how each
        KSI is addressed with historical metrics and evidence.
    - id: EVAL-3PAO-ASSESSMENT
      type: Behavioral
      mode: Manual
      required: true
      description: >
        Independent assessment by a FedRAMP-recognized Third Party
        Assessment Organization (3PAO) validating KSI implementation.
