# FedRAMP Class C required Key Security Indicators: the coverage denominator
# for mappings/*-to-ksi.mapping.yaml (read by scripts/coverage.py).
#
# Full Class C set (all 46 KSIs are mandatory at Class C, including the 5 that
# are optional at Class B: CNA-EIS, MLA-ALA, SVC-PRR, SVC-RUD, SVC-VCM), from
# mappings/vendor/fedramp/layer3-fedramp-class-c-policy.yaml's CON-CLASS-C-ALL-KSI
# constraint and layer2-fedramp-ksi.yaml's `controls` list.
certification: FedRAMP Class C
target: fedramp-ksi-controls
version: "2026.1.0"
required:
  - KSI-CED-RAT
  - KSI-CMT-LMC
  - KSI-CMT-RMV
  - KSI-CMT-RVP
  - KSI-CMT-VTD
  - KSI-CNA-DFP
  - KSI-CNA-EIS
  - KSI-CNA-IBP
  - KSI-CNA-MAT
  - KSI-CNA-OFA
  - KSI-CNA-RNT
  - KSI-CNA-RVP
  - KSI-CNA-ULN
  - KSI-IAM-AAM
  - KSI-IAM-APM
  - KSI-IAM-ELP
  - KSI-IAM-JIT
  - KSI-IAM-SNU
  - KSI-IAM-SUS
  - KSI-INR-AAR
  - KSI-INR-RIR
  - KSI-INR-RPI
  - KSI-MLA-ALA
  - KSI-MLA-EVC
  - KSI-MLA-LET
  - KSI-MLA-OSM
  - KSI-MLA-RVL
  - KSI-PIY-GIV
  - KSI-PIY-RES
  - KSI-PIY-RIS
  - KSI-PIY-RSD
  - KSI-PIY-RVD
  - KSI-RPL-ABO
  - KSI-RPL-ARP
  - KSI-RPL-RRO
  - KSI-RPL-TRC
  - KSI-SCR-MIT
  - KSI-SCR-MON
  - KSI-SVC-ACM
  - KSI-SVC-ASM
  - KSI-SVC-EIS
  - KSI-SVC-PRR
  - KSI-SVC-RUD
  - KSI-SVC-SIN
  - KSI-SVC-VCM
  - KSI-SVC-VRI
