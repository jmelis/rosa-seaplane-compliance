# Custom snappy spec: GitHub's classic branch-protection API
# (repos/{owner}/{repo}/branches/{branch}/protection), the same endpoint
# evidence/RSC.CMT.CTRL01.AR01.sh already queries.
#
# snappy ships a builtin "github/branch-rules.yaml", but it calls the newer
# GitHub Rulesets API (repos/{owner}/{repo}/rules/branches/{branch}) — a
# different feature from classic branch protection. A repo can have one
# configured without the other, so that builtin doesn't evidence what
# RSC.CMT.CTRL01.AR01 actually describes. snappy has no builtin for classic
# GitHub branch protection (unlike GitLab, which has
# specs/gitlab/branch-protection.yaml), hence this custom spec.
id: github.com/${ORG}/${REPO}@${BRANCH}
name: github.com/${ORG}/${REPO}@${BRANCH}
url: git+https://github.com/${ORG}/${REPO}/@${BRANCH}
type: http://github.com/openshift-online/rosa-seaplane-compliance/ampel/specs/github-branch-protection.yaml
endpoint: repos/${ORG}/${REPO}/branches/${BRANCH}/protection
method: GET
mask:
  - required_pull_request_reviews
  - required_status_checks
  - enforce_admins
  - allow_force_pushes
